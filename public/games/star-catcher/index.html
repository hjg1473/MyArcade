<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172033;color:#fff;font-family:system-ui,sans-serif}main{height:100%;display:grid;grid-template-rows:auto 1fr auto;place-items:center;padding:10px}.hud{width:min(100%,800px);display:flex;justify-content:space-between;font-weight:800;padding:4px 8px}canvas{width:min(100%,800px);height:100%;min-height:0;border:2px solid #ffffff33;border-radius:14px;background:linear-gradient(#26355f,#172033);touch-action:none}.controls{display:flex;gap:18px;padding:8px}.controls button{width:72px;height:42px;border:2px solid #fff;border-radius:12px;background:#ff7b72;color:#fff;font-size:22px;font-weight:900;box-shadow:0 3px 0 #fff6;touch-action:none}@media(min-width:800px){.controls{display:none}}</style></head><body><main><div class="hud"><span>STAR CATCHER</span><span id="score">★ 0</span></div><canvas width="800" height="390"></canvas><div class="controls"><button data-dir="-1" aria-label="Move left">←</button><button data-dir="1" aria-label="Move right">→</button></div></main><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),scoreEl=document.querySelector('#score');let basket=350,score=0,stars=[],left=false,right=false,last=0;function spawn(){stars.push({x:35+Math.random()*730,y:-20,s:2+Math.random()*2})}function star(cx,cy,r){x.save();x.translate(cx,cy);x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fillStyle='#ffd166';x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.restore()}function frame(t){let dt=Math.min((t-last)/16.67,2);last=t;if(left)basket-=8*dt;if(right)basket+=8*dt;basket=Math.max(0,Math.min(700,basket));if(Math.random()<.025)spawn();x.clearRect(0,0,800,390);for(let i=0;i<40;i++){x.fillStyle='#ffffff99';x.fillRect((i*83)%800,(i*47)%300,2,2)}stars.forEach(s=>{s.y+=s.s*dt;star(s.x,s.y,13)});stars=stars.filter(s=>{if(s.y>325&&s.y<375&&s.x>basket-12&&s.x<basket+112){score++;scoreEl.textContent='★ '+score;return false}return s.y<420});x.fillStyle='#ff7b72';x.beginPath();x.roundRect(basket,340,100,32,10);x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.stroke();requestAnimationFrame(frame)}addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=true;if(['ArrowRight','d','D'].includes(e.key))right=true});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=false;if(['ArrowRight','d','D'].includes(e.key))right=false});document.querySelectorAll('button').forEach(b=>{const set=v=>{if(b.dataset.dir==='-1')left=v;else right=v};b.addEventListener('pointerdown',e=>{e.preventDefault();set(true)});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>set(false))) });requestAnimationFrame(frame);
</script></body></html>
